# evals/golden.yaml
# Hand-labelled against fastapi/fastapi at 50113da. Every expect_files and
# expect_docs entry was opened and read; nothing here is inferred.
#
# kind: identifier  -- the question is mostly a literal name. This is the
#                      population pure vector search is expected to be worst at
#                      and the one Milestone 2 has to improve. Some are typed
#                      bare, some are phrased the way people actually search
#                      ("where is X defined", "X class") so M2 isn't measured
#                      only on the easiest form.
# kind: conceptual  -- the question is about behaviour or intent.
#
# expect_docs        -- docs/en/docs pages that genuinely answer the question
#                      from the user side. Only present where such a page
#                      exists; a conceptual entry without expect_docs means the
#                      question is internal-only and the docs don't cover it
#                      (verified at this commit, not assumed).
#
# Note on this commit: fastapi/_compat has no v1 module any more (pydantic v1
# raises PydanticV1NotSupportedError), fastapi/sse.py exists, and the routing
# layer has grown _IncludedRouter / _EffectiveRouteContext for include_router
# and FastAPI.frontend(). get_flat_dependant is gone (get_flat_params is the
# nearest survivor). Older mental models of the tree will mislabel.

