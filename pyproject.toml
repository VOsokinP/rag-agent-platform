[project]
name = "devagent"
version = "0.1.0"
description = "RAG-based coding assistant over a real GitHub repository"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openai>=1.54",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    # Runtime, not dev-only: devagent/cli.py is the client for the HTTP API.
    "httpx>=0.27",
    # The golden set is YAML because a human hand-edits it; see evals/golden.yaml.
    "pyyaml>=6.0",
]

[project.scripts]
devagent = "devagent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not sandbox'"
markers = [
    "integration: tests that require a live database or network (deselected by default)",
    "sandbox: tests that require Docker (deselected by default)",
]
filterwarnings = [
    # TestResult and TestRunner are production classes that pytest's naming
    # heuristic mistakes for test classes.
    "ignore:cannot collect test class 'Test(Result|Runner)':pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 88
# Deliberately unparseable and deliberately unused imports: they are ingestion
# fixtures, not code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` already holds code to the line length. What is left over is
# prose and long string literals, which it cannot split and which read worse
# broken up.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a default argument is how FastAPI declares a dependency.
"devagent/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["devagent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
