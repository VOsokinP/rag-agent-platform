name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      # Types are checked on the production package only; the tests use fakes
      # and stubs that would need annotating to no benefit.
      - run: mypy

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The default marker expression deselects everything needing Postgres, a
      # key, network, or Docker, so this needs no services and no secrets. If a
      # test ever fails here for want of one, that test is marked wrong.
      - run: pytest -q
